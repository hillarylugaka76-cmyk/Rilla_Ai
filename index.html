<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rilla_AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--accent:#4169e1;--accent-dark:#2f4fc0;--accent-soft:#e8edfc;--bg:#fbf8f1;--card:#fffdf9;--text:#1f2433;--muted:#6b7280;--border:#e8e2d4;--code:#0f172a;--bubble:#e8edfc}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
.app{display:flex;height:100dvh}
.sidebar{width:270px;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:14px;gap:12px;z-index:30;transition:transform .25s}
.new{background:var(--accent);color:#fff;padding:11px;border-radius:12px;font-weight:600;display:flex;gap:8px;align-items:center;justify-content:center}
.new:hover{background:var(--accent-dark)}
.sb-title{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:0 6px}
.list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.item{display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:10px;font-size:14px;cursor:pointer}
.item:hover,.item.on{background:var(--accent-soft)}
.item span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .del{color:var(--muted);padding:2px 5px;border-radius:6px}.item .del:hover{color:#dc2626}
.brand{font-size:12px;color:var(--muted);text-align:center}
.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:rgba(255,253,249,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.menu{display:none;font-size:20px;padding:6px 8px}
.av{width:42px;height:42px;border-radius:50%;object-fit:cover;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.hname{font-size:22px;font-weight:800;line-height:1.1}
.status{font-size:12px;color:#16a34a;display:flex;align-items:center;gap:5px}
.status:before{content:"";width:7px;height:7px;border-radius:50%;background:#22c55e}
#chat{flex:1;overflow-y:auto;padding:20px 16px}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.welcome{text-align:center;padding-top:6vh}
.welcome .av{width:104px;height:104px;font-size:44px;box-shadow:0 8px 24px rgba(65,105,225,.25)}
.welcome h1{margin:16px 0 6px;font-size:28px}
.welcome p{color:var(--muted);max-width:440px;margin:0 auto 24px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sug{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:left;font-size:14px;line-height:1.4}
.sug i{color:var(--accent);display:block;margin-bottom:6px}
.sug:hover{border-color:var(--accent);box-shadow:0 4px 14px rgba(65,105,225,.15)}
.row{display:flex;gap:10px}
.row.user{justify-content:flex-end}
.bub{background:var(--bubble);padding:10px 15px;border-radius:18px 18px 4px 18px;max-width:80%;line-height:1.5;word-break:break-word}
.row.bot .av{width:34px;height:34px;font-size:14px;margin-top:2px}
.body{min-width:0;flex:1}
.txt{line-height:1.65;word-break:break-word}
.txt p{margin:0 0 10px}.txt h4{margin:14px 0 6px;font-size:16px}
.txt ul,.txt ol{margin:0 0 10px;padding-left:22px}
.txt code{background:var(--accent-soft);color:var(--accent-dark);padding:1px 6px;border-radius:6px;font-size:.9em}
.cb{background:var(--code);border-radius:12px;margin:10px 0;overflow:hidden}
.ch{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;background:#1e293b;color:#cbd5e1;font-size:12px}
.cc{color:#cbd5e1;font-size:12px}.cc:hover{color:#fff}
.cb pre{padding:14px;overflow-x:auto}
.cb code{background:none;color:#e2e8f0;padding:0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.55}
.bar{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;margin-top:4px}
.bar button{color:var(--muted);font-size:14px;padding:3px}.bar button:hover{color:var(--accent)}
.bar .on{color:var(--accent)}
.err .txt{color:#b91c1c}
.dots{display:flex;gap:5px;padding:12px 0}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:b 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}
.inputwrap{padding:8px 16px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.box{max-width:780px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:24px;padding:8px 8px 8px 16px}
.box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(65,105,225,.15)}
textarea{flex:1;border:0;outline:0;resize:none;background:none;font:inherit;font-size:16px;max-height:160px;padding:8px 0;color:var(--text)}
#send{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;flex:none}
#send:disabled{background:#c5cdea;cursor:not-allowed}
.note{text-align:center;font-size:12px;color:var(--muted);margin-top:8px}
.ov{display:none}
@media(max-width:800px){
.sidebar{position:fixed;inset:0 auto 0 0;transform:translateX(-100%);box-shadow:4px 0 24px rgba(0,0,0,.15)}
.sidebar.open{transform:none}
.ov.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}
.menu{display:block}.cards{grid-template-columns:1fr}.bub{max-width:88%}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="side">
    <button class="new" id="newChat"><i class="fa-solid fa-plus"></i> New chat</button>
    <div class="sb-title">Recent chats</div>
    <div class="list" id="list"></div>
    <div class="brand">Made by Hillar Tech</div>
  </aside>
  <div class="ov" id="ov"></div>
  <div class="main">
    <header>
      <button class="menu" id="menu" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
      <img class="av" src="https://res.cloudinary.com/dqqyvozdw/image/upload/v1795019598/ytkzz1bnbdeeisalvkv7.png" alt="Rilla_AI">
      <div><div class="hname">Rilla_AI</div><div class="status">Online</div></div>
    </header>
    <div id="chat"><div class="wrap" id="msgs"></div></div>
    <div class="inputwrap">
      <div class="box">
        <textarea id="input" rows="1" placeholder="Ask Rilla_AI about your code..."></textarea>
        <button id="send" disabled aria-label="Send"><i class="fa-solid fa-arrow-up"></i></button>
      </div>
      <div class="note">Rilla_AI can make mistakes.</div>
    </div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
